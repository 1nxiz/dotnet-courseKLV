resources:
- deployment.yaml
- service.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
- name: aggregator-env
  literals:
    - OTEL_DOTNET_EXPERIMENTAL_OTLP_EMIT_EXCEPTION_LOG_ATTRIBUTES=true
    - OTEL_DOTNET_EXPERIMENTAL_OTLP_EMIT_EVENT_LOG_ATTRIBUTES=true
    - OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY=in_memory
    - ASPNETCORE_FORWARDEDHEADERS_ENABLED=true
    - HTTP_PORTS=8080
    - services__loans-api__grpc__0=loans-api:5111
    - services__loans-api__http__0=http://loans-api:5101
    - services__books-api__grpc__0=books-api:5112
    - services__books-api__http__0=http://books-api:5102
    - services__feedback-api__grpc__0=feedback-api:5113
    - services__feedback-api__http__0=http://feedback-api:5103
    - IdentityServer__Authority=http://identityserver:5010
    - services__keycloak__http__0=http://keycloak:8080
    - services__keycloak__management__0=keycloak:9000
    - OTEL_EXPORTER_OTLP_ENDPOINT=http://aspire-dashboard:18889
    - OTEL_SERVICE_NAME=aggregator
    - ASPNETCORE_URLS=http://+:8080;

secretGenerator:
- name: aggregator-secrets
  envs:
  - .aggregator.secrets
