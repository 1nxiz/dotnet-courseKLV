---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: identityserver-sql
  labels:
    app: identityserver-sql
spec:
  serviceName: "identityserver-sql"
  replicas: 1
  selector:
    matchLabels:
      app: identityserver-sql
  template:
    metadata:
      labels:
        app: identityserver-sql
    spec:
      containers:
        - name: identityserver-sql
          image: mcr.microsoft.com/mssql/server:2022-latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 1433
          envFrom:
            - configMapRef:
                name: identityserver-sql-env
            - secretRef:
                name: identityserver-sql-secrets
          volumeMounts:
            - name: library-identityserver-sql-data
              mountPath: /var/opt/mssql
  volumeClaimTemplates:
    - metadata:
        name: library-identityserver-sql-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
