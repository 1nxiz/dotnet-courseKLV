---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
  labels:
    app: payments-api
spec:
  minReadySeconds: 60
  replicas: 1
  selector:
    matchLabels:
      app: payments-api
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: payments-api
    spec:
      containers:
      - name: payments-api
        image: payments-api:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 5105
        envFrom:
        - configMapRef:
            name: payments-api-env
      terminationGracePeriodSeconds: 180