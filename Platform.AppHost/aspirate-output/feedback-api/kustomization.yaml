resources:
- deployment.yaml
- service.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
- name: feedback-api-env
  literals:
    - OTEL_DOTNET_EXPERIMENTAL_OTLP_EMIT_EXCEPTION_LOG_ATTRIBUTES=true
    - OTEL_DOTNET_EXPERIMENTAL_OTLP_EMIT_EVENT_LOG_ATTRIBUTES=true
    - OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY=in_memory
    - ASPNETCORE_FORWARDEDHEADERS_ENABLED=true
    - Kestrel__Endpoints__grpc__Url=http://*:5113
    - Kestrel__Endpoints__http__Url=http://*:5103
    - IdentityServer__Authority=http://identityserver:5010
    - services__keycloak__http__0=http://keycloak:8080
    - services__keycloak__management__0=keycloak:9000
    - OTEL_EXPORTER_OTLP_ENDPOINT=http://aspire-dashboard:18889
    - OTEL_SERVICE_NAME=feedback-api
    - ASPNETCORE_URLS=http://+:8080;

secretGenerator:
- name: feedback-api-secrets
  envs:
  - .feedback-api.secrets
