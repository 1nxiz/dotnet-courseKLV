apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: library
  labels: { app: gateway }
spec:
  replicas: 2
  selector:
    matchLabels: { app: gateway }
  template:
    metadata:
      labels: { app: gateway }
    spec:
      containers:
        - name: gateway
          image: gateway:v1                   # docker build -t gateway:v1 -f Platform.ApiGateway/Dockerfile .
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: gateway-config          # адреси сервісів
            - secretRef:
                name: gateway-secrets         # Jwt__SecretKey (Лаб. 09) — валідація JWT перед проксіюванням
          resources:
            requests: { memory: "96Mi", cpu: "50m" }
            limits: { memory: "256Mi" }
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 10
