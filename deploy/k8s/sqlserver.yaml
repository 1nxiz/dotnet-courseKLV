# SQL Server для books-api у кластері (залежність каталогу). Пароль SA — із Secret sql-secrets (kubectl create secret ...).
# Дані — у PersistentVolumeClaim: під час демонстрації readiness базу зупиняють (scale --replicas=0) і запускають знову,
# і BooksDb має пережити перезапуск пода (з emptyDir новий под отримав би порожній диск).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sql-data
  namespace: library
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: { storage: 2Gi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sql
  namespace: library
  labels: { app: sql }
spec:
  replicas: 1
  strategy: { type: Recreate }        # RWO-том: старий под звільняє диск до старту нового
  selector:
    matchLabels: { app: sql }
  template:
    metadata:
      labels: { app: sql }
    spec:
      containers:
        - name: sql
          image: mcr.microsoft.com/mssql/server:2022-latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 1433
          env:
            - name: ACCEPT_EULA
              value: "Y"
            - name: MSSQL_SA_PASSWORD
              valueFrom:
                secretKeyRef: { name: sql-secrets, key: MSSQL_SA_PASSWORD }
          resources:
            requests: { memory: "1Gi", cpu: "250m" }
            limits: { memory: "2Gi" }
          readinessProbe:
            tcpSocket: { port: 1433 }
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/opt/mssql
      securityContext:
        fsGroup: 10001                  # користувач mssql у образі — має право писати на том
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: sql-data }
---
apiVersion: v1
kind: Service
metadata:
  name: sql                 # DNS-ім'я всередині namespace: sql
  namespace: library
spec:
  type: ClusterIP
  selector: { app: sql }
  ports:
    - port: 1433
      targetPort: 1433
